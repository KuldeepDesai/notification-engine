# This is a basic workflow to help you get started with Actions

name: SYNC

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "docs/domain-model" branch
  push:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  sync:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Runs a single command using the runners shell
      - name: Push
        env:
          TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$TOKEN" ]; then
            echo "Error: TOKEN is missing"
            exit 1
          fi

          git config --local --unset-all \
            http.https://github.com/.extraheader || true
          
          git -c credentail.helpers= \
            -c http.https://github.com/.extraheader= \
            push \
            "https://x-access-token:${TOKEN}@github.com/KuldeepDesai/notification-engine.git" \
            HEAD:refs/heads/main
